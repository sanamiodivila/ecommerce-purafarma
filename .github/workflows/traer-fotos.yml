          ls -la fotos
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git rm -q .github/workflows/traer-fotos.yml
          git add fotos
          git commit -m "Fotos traidas"
          git push
