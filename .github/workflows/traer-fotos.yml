name: traer-fotos-temporal
on:
  push:
    branches: [tmp-traer-fotos]
permissions:
  contents: write
jobs:
  traer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p fotos
          while read -r c u; do
            [ -z "$c" ] && continue
            curl -fsSL --retry 3 -o "fotos/$c.jpg" "$u" && echo "ok $c" || echo "FALLO $c"
          done <<'LISTA'
